<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWebPageIndex</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Music toggle button -->
    <button id="music-toggle" class="music-btn">🔇</button>

    <div class="main-content-wrapper">
        <div class="main-content">
            <h1>Welcome to My Web Page</h1>
            
            <p>This is a web page where I will share many things from my experiences here. It's a secret, you know.</p>
            
            <p>Well, well, see how it goes. I want you to guess what things I will share with you.</p>
            
            <p>I actually wanted you to tell me gibberish, and I love you🫶.</p>
            
            <h2>Thanks by Harsh Yadav</h2>
        </div>
    </div>

    <!-- Snow canvas overlay -->
    <canvas id="snow-canvas"></canvas>

    <!-- Background music -->
    <audio id="bg-music" loop autoplay>
        <source src="../audio/background-music.mp3" type="audio/mpeg">
        <source src="../audio/background-music.ogg" type="audio/ogg">
    </audio>

    <!-- Harry Potter image -->
    <img src="../images/img.png" alt="Harry Potter" class="hp-img hp-1" />

    <script src="../js/script.js"></script>
</body>

</html>
